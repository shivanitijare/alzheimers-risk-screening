[theme]
base = "light"
primaryColor = "#1F4E8C"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#0F1B2D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600]
baseRadius = "10px"
borderColor = "#E3E7ED"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
